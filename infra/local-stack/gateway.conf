map $http_x_request_id $gateway_request_id {
  default $http_x_request_id;
  "" $request_id;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream platform_web {
  server platform-web:4022;
  keepalive 16;
}

upstream platform_api {
  server platform-api:4011;
  keepalive 16;
}

upstream hrms_web {
  server hrms-web:4023;
  keepalive 16;
}

upstream hrms_api {
  server hrms-api:4012;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 10m;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  location = /gateway-health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"deltcrm-local-gateway"}';
  }

  location = /api/hrms/healthz {
    proxy_pass http://hrms_api/healthz;
    include /etc/nginx/proxy_params;
  }

  location = /api/hrms/readyz {
    proxy_pass http://hrms_api/readyz;
    include /etc/nginx/proxy_params;
  }

  location ^~ /api/hrms/ {
    proxy_pass http://hrms_api;
    include /etc/nginx/proxy_params;
  }

  # Platform-owned tenant APIs must bypass both Next.js frontends. Keep this
  # ownership list aligned with infra/local-product-separation/gateway.conf.
  location ~ ^/(auth|platform|products|product-integration|workspace|internal|\.well-known|tenant-settings|users|roles|permissions|notifications|notification-preferences|billing|tenant-localization-policy|tenant-localization-overrides|localization|audit-logs|healthz|readyz)(/|$) {
    proxy_pass http://platform_api;
    include /etc/nginx/proxy_params;
  }

  location ^~ /public/localization/ {
    proxy_pass http://platform_api;
    include /etc/nginx/proxy_params;
  }

  location ~ ^/(en|ar)/app/hrms/(unauthorized|subscription-required|unavailable)/?$ {
    proxy_pass http://platform_web;
    include /etc/nginx/proxy_params;
  }

  location ~ ^/(en|ar)/app/hrms(?:/|$) {
    proxy_pass http://hrms_web;
    include /etc/nginx/proxy_params;
  }

  location / {
    proxy_pass http://platform_web;
    include /etc/nginx/proxy_params;
  }
}

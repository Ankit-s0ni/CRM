map $http_x_request_id $gateway_request_id {
  default $http_x_request_id;
  "" $request_id;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# Docker Desktop advertises host.docker.internal over both address families,
# but its container-to-host IPv6 route is not always reachable. Resolve local
# host services dynamically and select IPv4 so requests do not intermittently
# fail before Nginx retries the healthy address.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 2s;

# Platform control-plane paths are shared by browser pages and JSON APIs.
# Browser navigations advertise text/html; Axios API calls advertise JSON.
# Route the same path to the correct owner without exposing separate browser
# ports or requiring a second public hostname.
map $http_accept $platform_upstream {
  default platform_api;
  ~*text/html platform_web;
}

upstream platform_web {
  zone platform_web 64k;
  server ${HOST_UPSTREAM_ADDRESS}:4022 resolve max_fails=0;
  keepalive 16;
}

upstream platform_api {
  zone platform_api 64k;
  server ${HOST_UPSTREAM_ADDRESS}:4011 resolve max_fails=0;
  keepalive 16;
}

upstream hrms_web {
  zone hrms_web 64k;
  server ${HOST_UPSTREAM_ADDRESS}:${HRMS_WEB_UPSTREAM_PORT} resolve max_fails=0;
  keepalive 16;
}

upstream hrms_api {
  zone hrms_api 64k;
  server ${HOST_UPSTREAM_ADDRESS}:${HRMS_UPSTREAM_PORT} resolve max_fails=0;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 10m;
  # Docker Desktop's host bridge can briefly queue new connections while a
  # production Next.js build is serving a full multi-page browser crawl.
  proxy_connect_timeout 15s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  # Nginx otherwise sends `Connection: close` to proxied HTTP/1.1 services.
  # Reuse the upstream pools so the all-screen browser crawl does not exhaust
  # Docker Desktop's container-to-host connection backlog.
  proxy_set_header Connection "";

  location = /gateway-health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"deltcrm-local-gateway"}';
  }

  location = /healthz {
    proxy_pass http://platform_api/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /readyz {
    proxy_pass http://platform_api/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /api/hrms/healthz {
    proxy_pass http://hrms_api/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /api/hrms/readyz {
    proxy_pass http://hrms_api/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location ^~ /api/hrms/ {
    proxy_pass http://hrms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  # Platform-owned tenant APIs must bypass both Next.js frontends. Keep this
  # ownership list aligned with the product client's isPlatformTenantPath().
  location ~ ^/(auth|products|product-integration|workspace|internal|\.well-known|tenant-settings|users|roles|permissions|notifications|notification-preferences|billing|tenant-localization-policy|tenant-localization-overrides|localization|audit-logs)(/|$) {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location ^~ /public/localization/ {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /platform/login {
    proxy_pass http://platform_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /platform {
    proxy_pass http://platform_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location ~ ^/platform(?:/|$) {
    proxy_pass http://$platform_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Access-state pages belong to Platform because entitlement decisions are
  # authoritative in the control plane, not in the product frontend.
  location ~ ^/(en|ar)/app/hrms/(unauthorized|subscription-required|unavailable)/?$ {
    proxy_pass http://platform_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Backward compatibility for HRMS bookmarks created before product
  # extraction. Only unambiguous HRMS-owned paths are redirected; shared
  # Platform paths such as /app/settings and /app/access remain Platform-owned.
  location ~ ^/(en|ar)/app/(employees|attendance|leave|payroll|reports|imports|organization|notifications)(/.*)?$ {
    return 308 $scheme://$http_host/$1/app/hrms/$2$3$is_args$args;
  }

  # HRMS and Platform share one browser origin, so their Next.js build assets
  # must use separate public paths. Strip the HRMS asset prefix only when
  # forwarding to the HRMS web process.
  location ^~ /hrms-assets/ {
    rewrite ^/hrms-assets/(.*)$ /$1 break;
    proxy_pass http://hrms_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location ~ ^/(en|ar)/app/hrms(?:/|$) {
    proxy_pass http://hrms_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://platform_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

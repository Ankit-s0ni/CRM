map $http_x_request_id $gateway_request_id {
  default $http_x_request_id;
  "" $request_id;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream platform_web {
  server host.docker.internal:4022;
  keepalive 16;
}

upstream platform_api {
  server host.docker.internal:4011;
  keepalive 16;
}

upstream hrms_web {
  server host.docker.internal:${HRMS_WEB_UPSTREAM_PORT};
  keepalive 16;
}

upstream hrms_api {
  server host.docker.internal:${HRMS_UPSTREAM_PORT};
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 10m;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  location = /gateway-health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"deltcrm-local-gateway"}';
  }

  location = /healthz {
    proxy_pass http://platform_api/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /readyz {
    proxy_pass http://platform_api/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /api/hrms/healthz {
    proxy_pass http://hrms_api/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location = /api/hrms/readyz {
    proxy_pass http://hrms_api/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location ^~ /api/hrms/ {
    proxy_pass http://hrms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  location ~ ^/(auth|platform|products|product-integration|workspace|internal|\.well-known)(/|$) {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
  }

  # Access-state pages belong to Platform because entitlement decisions are
  # authoritative in the control plane, not in the product frontend.
  location ~ ^/(en|ar)/app/hrms/(unauthorized|subscription-required|unavailable)/?$ {
    proxy_pass http://platform_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ~ ^/(en|ar)/app/hrms(?:/|$) {
    proxy_pass http://hrms_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://platform_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $gateway_request_id;
    proxy_set_header X-Correlation-Id $gateway_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

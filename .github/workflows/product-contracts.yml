name: Dynamic product architecture

on:
  pull_request:
    paths:
      - "apps/api/src/platform/product-integration/**"
      - "apps/api/prisma/platform/**"
      - "apps/api/package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-dynamic-product-architecture.mjs"
      - ".github/workflows/product-contracts.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/platform/product-integration/**"
      - "apps/api/prisma/platform/**"
      - "apps/api/package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-dynamic-product-architecture.mjs"

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@mariya-abdul'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm architecture:check

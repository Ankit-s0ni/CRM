<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Ribbon Gradient -->
    <linearGradient id="icon-ribbon-dark" x1="120" y1="120" x2="360" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#1E40AF" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Vibrant Cyan Peak Gradient -->
    <linearGradient id="icon-ribbon-light" x1="260" y1="400" x2="520" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Right Leg Downward Gradient -->
    <linearGradient id="icon-ribbon-right" x1="420" y1="180" x2="560" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="icon-fold-shadow" x1="300" y1="360" x2="360" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="translate(-50, -40)">
    <!-- Main Left-to-Bottom Loop -->
    <path 
      d="M 355 120 
         L 198 440 
         C 182 472 210 505 246 505 
         C 278 505 306 485 322 456 
         L 396 322 
         C 410 296 448 296 462 322 
         L 530 456 
         C 542 480 572 494 596 482 
         C 620 470 630 440 618 416 
         L 422 120 
         C 408 98 370 98 355 120 Z" 
      fill="url(#icon-ribbon-dark)" 
    />

    <!-- Inner Upward Cyan Ribbon -->
    <path 
      d="M 246 505 
         C 290 505 328 478 348 438 
         L 418 298 
         C 430 274 465 274 477 298 
         L 566 472 
         L 510 472 
         L 448 348 
         L 385 472 
         C 360 518 308 545 254 545 
         C 185 545 138 482 166 422 
         L 315 125 
         L 370 125 
         L 222 428 
         C 210 454 228 505 246 505 Z" 
      fill="url(#icon-ribbon-light)" 
    />

    <!-- Right Leg Outer Accent -->
    <path 
      d="M 422 120 
         L 595 452 
         C 605 472 592 496 570 496 
         C 556 496 544 488 537 475 
         L 390 186 
         Z" 
      fill="url(#icon-ribbon-right)" 
    />

    <!-- Ambient Shadow -->
    <path 
      d="M 290 420 
         C 315 440 345 460 375 475 
         L 345 495 
         C 315 480 290 455 275 430 Z" 
      fill="url(#icon-fold-shadow)" 
    />
  </g>
</svg>

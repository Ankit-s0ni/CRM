name: deltcrm-platform-local

services:
  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_platform_postgres_only
    ports:
      - "5451:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [platform, integration]

  platform-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - platform_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [platform, integration]

  platform-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platformminio
      MINIO_ROOT_PASSWORD: local-platform-minio-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - platform_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [platform]

  platform-minio-init:
    image: minio/mc:latest
    depends_on:
      platform-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set platform http://platform-minio:9000 platformminio local-platform-minio-secret &&
        mc mb --ignore-existing platform/platform-private
    restart: "no"
    networks: [platform]

  platform-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      secrets:
        - npm_token
    command:
      - /bin/sh
      - -c
      - >-
        pnpm --filter api exec prisma migrate deploy --config prisma.config.ts &&
        pnpm --filter api exec prisma db seed --config prisma.config.ts &&
        pnpm --filter api start:platform:prod
    environment:
      NODE_ENV: development
      PLATFORM_API_PORT: "4011"
      DATABASE_URL: postgresql://postgres:local_platform_postgres_only@platform-db:5432/platform_local?schema=public
      DATABASE_URL_APP: postgresql://app_user:app_password@platform-db:5432/platform_local?schema=public
      DATABASE_URL_PLATFORM: postgresql://platform_runtime:platform_password@platform-db:5432/platform_local?schema=public
      REDIS_URL: redis://platform-redis:6379
      S3_ENDPOINT: http://platform-minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_ACCESS_KEY: platformminio
      S3_SECRET_KEY: local-platform-minio-secret
      S3_BUCKET: platform-public
      S3_PRIVATE_BUCKET: platform-private
      S3_REGION: local-1
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: http://localhost:4080,http://localhost:4022,http://localhost:4023
      JWT_SECRET: local-platform-jwt-secret-change-before-production
      PRODUCT_TOKEN_ISSUER: http://platform-api:4011
      PRODUCT_TOKEN_KEY_ID: local-platform-product-token-v1
      PRODUCT_SERVICE_CREDENTIALS_JSON: '{"HRMS":["local-product-service-key"]}'
      PUBLIC_APP_ORIGIN: http://localhost:4080
      PUBLIC_BASE_DOMAIN: localhost
      MAIL_ENABLED: "false"
    ports:
      - "4011:4011"
    depends_on:
      platform-db:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
      platform-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4011/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
    networks: [platform, integration]

  platform-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      secrets:
        - npm_token
    command: ["pnpm", "--filter", "api", "start:worker:prod"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:local_platform_postgres_only@platform-db:5432/platform_local?schema=public
      DATABASE_URL_APP: postgresql://app_user:app_password@platform-db:5432/platform_local?schema=public
      DATABASE_URL_PLATFORM: postgresql://platform_runtime:platform_password@platform-db:5432/platform_local?schema=public
      REDIS_URL: redis://platform-redis:6379
      NOTIFICATION_QUEUE_MODE: enabled
    depends_on:
      platform-db:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform, integration]

  platform-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - npm_token
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4080
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4080
    ports:
      - "4022:4022"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4022').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks: [platform, integration]

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "4080:8080"
    volumes:
      - ./infra/local-stack/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/local-stack/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      platform-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway-health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [integration]

volumes:
  platform_db_data:
  platform_redis_data:
  platform_minio_data:

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN

networks:
  platform:
  integration:
    name: deltcrm-local-integration
